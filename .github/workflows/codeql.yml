name: CodeQL

# 정적 분석(#275). 결과는 Security 탭의 code scanning으로 올리고 PR을 막지 않는다(보고만).
# 빌드가 없는 정적 확장이라 두 언어 모두 build-mode none으로 분석한다. 외부 번들이 없어 제외 경로도 없다.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * 0" # 매주 월요일 03:17 KST

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript # 확장, 랜딩, 스크립트
            build-mode: none
          - language: actions # 워크플로
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
