name: Link Check

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore link check state
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/link-check-state.json
          key: link-check-state-${{ github.run_id }}
          restore-keys: link-check-state-

      - name: Check service links
        id: links
        shell: bash
        run: |
          set +e
          npm run check:links -- --report "$RUNNER_TEMP/linkcheck-report.md" --state "$RUNNER_TEMP/link-check-state.json"
          status=$?
          set -e
          if [[ "$status" -gt 1 || ! -s "$RUNNER_TEMP/linkcheck-report.md" ]]; then
            echo "접속 검사 실행 자체가 실패했습니다."
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Update link check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_STATUS: ${{ steps.links.outputs.status }}
        shell: bash
        run: |
          gh label create link-check --force --color D93F0B --description '지원 서비스 자동 접속 검사'
          issue_numbers=$(gh issue list --label link-check --state open --limit 1000 --json number --jq '.[].number')
          issues=()
          if [[ -n "$issue_numbers" ]]; then
            while IFS= read -r issue; do
              issues+=("$issue")
            done <<< "$issue_numbers"
          fi
          if [[ "$CHECK_STATUS" == "1" ]]; then
            count=$(sed -n 's/^수정 검토 대상 \([0-9]*\)곳, 관찰 중 .*$/\1/p' "$RUNNER_TEMP/linkcheck-report.md")
            [[ "$count" =~ ^[1-9][0-9]*$ ]]
            title="[BUG] 지원 서비스 접속 실패 ${count}곳"
            if [[ ${#issues[@]} -eq 0 ]]; then
              gh issue create --label link-check --title "$title" --body-file "$RUNNER_TEMP/linkcheck-report.md"
            else
              gh issue edit "${issues[0]}" --title "$title" --body-file "$RUNNER_TEMP/linkcheck-report.md"
              for issue in "${issues[@]:1}"; do
                gh issue close "$issue" --comment "접속 검사 결과를 #${issues[0]} 이슈로 통합합니다."
              done
            fi
          else
            for issue in "${issues[@]}"; do
              gh issue close "$issue" --comment '하루 넘게 실패한 수정 검토 대상이 없어 자동 접속 검사 이슈를 닫습니다. 오늘 처음 실패한 서비스는 관찰을 계속합니다.'
            done
          fi

      - name: Check state file exists
        id: state
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/link-check-state.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save link check state
        if: always() && steps.state.outputs.exists == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/link-check-state.json
          key: link-check-state-${{ github.run_id }}
