<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LinKHU 설정</title>
    <!-- 첫 페인트 전에 테마 표식을 붙여야 하므로 스타일시트보다 먼저 로드한다. -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <div class="options-header">
        <h1>⚙️ LinKHU 설정</h1>
        <button
          id="theme-toggle"
          class="icon-button"
          type="button"
          data-theme-toggle
          aria-label="다크 테마로 전환"

42 11.25 22V21C11.25 20.5858 11.5858 20.25 12 20.25Z" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="info">
        원하는 사이트를 드래그하여 오른쪽 '내 바로가기'로 옮겨주세요.
      </p>

      <div id="shortcut-guide" class="shortcut-guide" hidden>
        <strong>단축키가 설정되어 있지 않습니다.</strong>
        <p>
          브라우저 확장 프로그램 단축키 설정 화면에서 LinKHU 단축키를 직접
          지정해주세요.
        </p>
        <ul>
          <li>
            Chrome:
            <button type="button" class="shortcut-link" data-shortcut-url="chrome://extensions/shortcuts">
              chrome://extensions/shortcuts
            </button>
          </li>
          <li>
            Whale:
            <button type="button" class="shortcut-link" data-shortcut-url="whale://extensions/shortcuts">
              whale://extensions/shortcuts
            </button>
          </li>
          <li>
            Firefox:
            <button type="button" class="shortcut-link" data-shortcut-url="about:addons">
              about:addons
            </button>
            → 톱니바퀴 메뉴 → 확장 기능 단축키 관리
          </li>
        </ul>
      </div>

      <div class="board">
        <div class="column">
          <h2>사용 가능한 사이트</h2>
          <div class="option-search">
            <input
              id="site-search"
              type="search"
              placeholder="서비스 검색"
              autocomplete="off"
              aria-label="서비스 검색"
            />
          </div>
          <p id="search-empty-message" class="search-empty-message" hidden>
            검색 결과 없음
          </p>
          <div class="scroll-area">
            <div class="category-group">
              <div class="category-title">📌 공통 서비스</div>
              <div id="zone-공통" class="drop-zone" data-category="공통"></div>
            </div>
            <div class="category-group">
              <div class="category-title">🏛️ 단과대학</div>
              <div
                id="zone-단과대"
                class="drop-zone"
                data-category="단과대"
              ></div>
            </div>
            <div class="category-group">
              <div class="category-title">🎓 학과/전공</div>
              <div id="zone-학과" class="drop-zone" data-category="학과"></div>
            </div>
          </div>
        </div>

        <div class="column">
          <h2>내 바로가기 (활성화됨)</h2>
          <div class="scroll-area">
            <div
              id="active-list"
              class="drop-zone"
              style="min-height: 100%"
            ></div>
          </div>
        </div>
      </div>

      <button id="save-btn" class="save-btn">변경사항 저장하기</button>

      <fieldset class="theme-control">
        <legend class="theme-legend">테마</legend>
        <label class="theme-option">
          <input type="radio" name="theme-mode" value="system" />
          시스템 설정
        </label>
        <label class="theme-option">
          <input type="radio" name="theme-mode" value="light" />
          라이트
        </label>
        <label class="theme-option">
          <input type="radio" name="theme-mode" value="dark" />
          다크
        </label>
        <span id="theme-status" class="theme-status" role="status"></span>
      </fieldset>

      <footer class="options-footer">
        <a
          class="footer-link"
          href="https://kangkyunghyun.github.io/LinKHU/"
          target="_blank"
          rel="noopener noreferrer"
          >LinKHU 홈페이지</a
        >
        <span class="footer-divider" aria-hidden="true">·</span>
        <button id="feedback-toggle" class="footer-link" type="button">
          문의하기
        </button>
      </footer>

      <div id="feedback-panel" class="feedback-panel" hidden>
        <textarea
          id="feedback-message"
          rows="3"
          placeholder="불편한 점이나 추가하고 싶은 서비스를 적어주세요."
          aria-label="문의 내용"
        ></textarea>
        <input
          id="feedback-email"
          class="feedback-email"
          type="email"
          placeholder="답변 받을 이메일 (선택)"
          aria-label="답변 받을 이메일 (선택)"
          autocomplete="email"
          hidden
        />
        <div class="feedback-actions">
          <button id="feedback-send" class="feedback-send" type="button">
            보내기
          </button>
        </div>
        <p id="feedback-status" class="feedback-status" role="status"></p>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="feedback.js"></script>
    <script src="options.js"></script>
  </body>
</html>
