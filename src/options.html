<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LinKHU 설정</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <h1>⚙️ LinKHU 설정</h1>
      <p class="info">
        원하는 사이트를 드래그하여 오른쪽 '내 바로가기'로 옮겨주세요.
      </p>

      <div class="board">
        <div class="column">
          <h2>사용 가능한 사이트</h2>
          <div class="scroll-area">
            <div class="category-group">
              <div class="category-title">📌 공통 서비스</div>
              <div id="zone-공통" class="drop-zone" data-category="공통"></div>
            </div>
            <div class="category-group">
              <div class="category-title">🏛️ 단과대학</div>
              <div
                id="zone-단과대"
                class="drop-zone"
                data-category="단과대"
              ></div>
            </div>
            <div class="category-group">
              <div class="category-title">🎓 학과/전공</div>
              <div id="zone-학과" class="drop-zone" data-category="학과"></div>
            </div>
          </div>
        </div>

        <div class="column">
          <h2>내 바로가기 (활성화됨)</h2>
          <div class="scroll-area">
            <div
              id="active-list"
              class="drop-zone"
              style="min-height: 100%"
            ></div>
          </div>
        </div>
      </div>

      <button id="save-btn" class="save-btn">변경사항 저장하기</button>
    </div>

    <script src="data.js"></script>
    <script src="options.js"></script>
  </body>
</html>
