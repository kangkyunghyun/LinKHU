<html lang="ko">

      </div>

      <details id="shortcut-guide" class="shortcut-guide" hidden>
        <summary>단축키가 설정되어 있지 않습니다.</summary>
        <p>
          브라우저 확장 프로그램 단축키 설정 화면에서 LinKHU 단축키를 직접
          지정해주세요.
        </p>
        <ul>
          <li>
            Chrome:
            <button type="button" class="shortcut-link" data-shortcut-url="chrome://extensions/shortcuts">
              chrome://extensions/shortcuts
            </button>
          </li>
          <li>
            Whale:
            <button type="button" class="shortcut-link" data-shortcut-url="whale://extensions/shortcuts">
              whale://extensions/shortcuts
            </button>
          </li>
          <li>
            Firefox:
            <button type="button" class="shortcut-link" data-shortcut-url="about:addons">
              about:addons
            </button>
            → 톱니바퀴 메뉴 → 확장 기능 단축키 관리
          </li>
        </ul>
      </details>

      <div class="board">
        <div class="column">
          <h2>사용 가능한 사이트</h2>
          <div class="option-controls">
            <div class="option-search">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="scale(1.33333)"><path d="M15.75 15.75L11.6386 11.6386" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path> <path d="M7.75 13.25C10.7875 13.25 13.25 10.7875 13.25 7.75C13.25 4.7125 10.7875 2.25 7.75 2.25C4.7125 2.25 2.25 4.7125 2.25 7.75C2.25 10.7875 4.7125 13.25 7.75 13.25Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></g></svg>
              <input
                id="site-search"
                type="search"
                placeholder="서비스 검색"
                autocomplete="off"
                aria-label="서비스 검색"
              />
            </div>

            <div class="option-filters" role="group" aria-label="카테고리 필터">
              <button
                type="button"
                class="filter-chip"
                data-category-filter="공통"
                aria-pressed="false"
              >
                공통
              </button>
              <button
                type="button"
                class="filter-chip"
                data-category-filter="단과대"
                aria-pressed="false"
              >
                단과대
              </button>
              <button
                type="button"
                class="filter-chip"
                data-category-filter="학과"
                aria-pressed="false"
              >
                학과
              </button>
            </div>
          </div>

                id="zone-단과대"
                class="drop-zone"

              ></div>
            </div>
            <div class="category-group">
              <div class="category-title"><svg class="category-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="scale(1.33333)"><path d="M9.45801 2.361L15.79 5.621C16.403 5.937 16.403 6.813 15.79 7.129L9.45801 10.389C9.17001 10.537 8.829 10.537 8.542 10.389L2.20999 7.129C1.59699 6.813 1.59699 5.937 2.20999 5.621L8.542 2.361C8.83 2.213 9.17101 2.213 9.45801 2.361Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path> <path d="M16.25 6.375C16.079 7.115 15.932 8.097 15.969 9.25C15.996 10.084 16.113 10.812 16.25 11.406" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path> <path d="M4.25 11.5535V14C4.25 15.104 6.377 16 9 16C11.623 16 13.75 15.104 13.75 14V11.5535" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></g></svg>학과/전공</div>
              <div id="zone-학과" class="drop-zone" data-category="학과"></div>
            </div>
          </div>
        </div>

        <div class="column">
          <h2>내 바로가기 (활성화됨)</h2>
          <div class="scroll-area">
            <div
              id="active-list"
              class="drop-zone"
              style="min-height: 100%"
            ></div>
          </div>
        </div>
      </div>

      <button id="save-btn" class="save-btn">변경사항 저장하기</button>

      <p id="theme-status" class="theme-status" role="status" data-theme-status></p>

      <footer class="options-footer">
        <a
          class="footer-link"
          href="https://kangkyunghyun.github.io/LinKHU/"
          target="_blank"
          rel="noopener noreferrer"
          >LinKHU 홈페이지</a
        >
        <span class="footer-divider" aria-hidden="true">·</span>
        <button id="feedback-toggle" class="footer-link" type="button">
          문의하기
        </button>
      </footer>

      <div id="feedback-panel" class="feedback-panel" hidden>
        <textarea
          id="feedback-message"
          rows="3"
          placeholder="불편한 점이나 추가하고 싶은 서비스를 적어주세요."
          aria-label="문의 내용"
        ></textarea>
        <input
          id="feedback-email"
          class="feedback-email"
          type="email"
          placeholder="답변 받을 이메일 (선택)"
          aria-label="답변 받을 이메일 (선택)"
          autocomplete="email"
          hidden
        />
        <div class="feedback-actions">
          <button id="feedback-send" class="feedback-send" type="button">
            보내기
          </button>
        </div>
        <p id="feedback-status" class="feedback-status" role="status"></p>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="feedback.js"></script>
    <script src="options.js"></script>
  </body>
</html>
