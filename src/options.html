<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LinKHU 설정</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <h1>⚙️ LinKHU 설정</h1>
      <p class="info">
        원하는 사이트를 드래그하여 오른쪽 '내 바로가기'로 옮겨주세요.
      </p>

      <div id="shortcut-guide" class="shortcut-guide" hidden>
        <strong>단축키가 설정되어 있지 않습니다.</strong>
        <p>
          브라우저 확장 프로그램 단축키 설정 화면에서 LinKHU 단축키를 직접
          지정해주세요.
        </p>
        <ul>
          <li>
            Chrome:
            <button type="button" class="shortcut-link" data-shortcut-url="chrome://extensions/shortcuts">
              chrome://extensions/shortcuts
            </button>
          </li>
          <li>
            Whale:
            <button type="button" class="shortcut-link" data-shortcut-url="whale://extensions/shortcuts">
              whale://extensions/shortcuts
            </button>
          </li>
          <li>
            Firefox:
            <button type="button" class="shortcut-link" data-shortcut-url="about:addons">
              about:addons
            </button>
            → 톱니바퀴 메뉴 → 확장 기능 단축키 관리
          </li>
        </ul>
      </div>

      <div class="board">
        <div class="column">
          <h2>사용 가능한 사이트</h2>
          <div class="option-search">
            <input
              id="site-search"
              type="search"
              placeholder="서비스 검색"
              autocomplete="off"
              aria-label="서비스 검색"
            />
          </div>
          <p id="search-empty-message" class="search-empty-message" hidden>
            검색 결과 없음
          </p>
          <div class="scroll-area">
            <div class="category-group">
              <div class="category-title">📌 공통 서비스</div>
              <div id="zone-공통" class="drop-zone" data-category="공통"></div>
            </div>
            <div class="category-group">
              <div class="category-title">🏛️ 단과대학</div>
              <div
                id="zone-단과대"
                class="drop-zone"
                data-category="단과대"
              ></div>
            </div>
            <div class="category-group">
              <div class="category-title">🎓 학과/전공</div>
              <div id="zone-학과" class="drop-zone" data-category="학과"></div>
            </div>
          </div>
        </div>

        <div class="column">
          <h2>내 바로가기 (활성화됨)</h2>
          <div class="scroll-area">
            <div
              id="active-list"
              class="drop-zone"
              style="min-height: 100%"
            ></div>
          </div>
        </div>
      </div>

      <button id="save-btn" class="save-btn">변경사항 저장하기</button>
    </div>

    <script src="data.js"></script>
    <script src="options.js"></script>
  </body>
</html>
