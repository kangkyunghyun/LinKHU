<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LinKHU 설정</title>
    <!-- 첫 페인트 전에 테마 표식을 붙여야 하므로 스타일시트보다 먼저 로드한다. -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <div class="options-header">
        <h1><img class="title-logo" src="icons/icon48.png" width="26" height="26" alt="" />LinKHU 설정</h1>
        <p class="info">
          원하는 사이트를 오른쪽 '내 바로가기'로 드래그하세요.
        </p>
        <a
          class="header-link"
          href="https://kangkyunghyun.github.io/LinKHU/"
          target="_blank"
          rel="noopener noreferrer"
          >홈페이지</a
        >
        <button id="feedback-toggle" class="header-link" type="button">
          문의하기
        </button>

        <button
          id="theme-toggle"
          class="icon-button"
          type="button"
          data-theme-toggle
          aria-label="테마: 시스템 설정. 누르면 라이트"
          title="테마: 시스템 설정. 누르면 라이트"

        </button>

        <div id="feedback-panel" class="feedback-panel" hidden>
          <textarea
            id="feedback-message"
            rows="3"
            placeholder="불편한 점이나 추가하고 싶은 서비스를 적어주세요."
            aria-label="문의 내용"
          ></textarea>
          <input
            id="feedback-email"
            class="feedback-email"
            type="email"
            placeholder="답변 받을 이메일 (선택)"
            aria-label="답변 받을 이메일 (선택)"
            autocomplete="email"
            hidden
          />
          <div class="feedback-actions">
            <button id="feedback-send" class="feedback-send" type="button">
              보내기
            </button>
          </div>
          <p id="feedback-status" class="feedback-status" role="status"></p>
        </div>
      </div>

      <details id="shortcut-guide" class="shortcut-guide" hidden>
        <summary>단축키가 설정되어 있지 않습니다.</summary>
        <p>
          브라우저 확장 프로그램 단축키 설정 화면에서 LinKHU 단축키를 직접
          지정해주세요.
        </p>
        <ul>
          <li>
            Chrome:
            <button type="button" class="shortcut-link" data-shortcut-url="chrome://extensions/shortcuts">
              chrome://extensions/shortcuts
            </button>
          </li>
          <li>
            Whale:
            <button type="button" class="shortcut-link" data-shortcut-url="whale://extensions/shortcuts">
              whale://extensions/shortcuts
            </button>
          </li>
          <li>
            Firefox:
            <button type="button" class="shortcut-link" data-shortcut-url="about:addons">
              about:addons
            </button>
            → 톱니바퀴 메뉴 → 확장 기능 단축키 관리
          </li>
        </ul>
      </details>

      <div class="board">
        <div class="column">
          <h2>사용 가능한 사이트</h2>
          <div class="option-controls">
            <div class="option-search">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="scale(1.33333)"><path d="M15.75 15.75L11.6386 11.6386" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path> <path d="M7.75 13.25C10.7875 13.25 13.25 10.7875 13.25 7.75C13.25 4.7125 10.7875 2.25 7.75 2.25C4.7125 2.25 2.25 4.7125 2.25 7.75C2.25 10.7875 4.7125 13.25 7.75 13.25Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></g></svg>
              <input
                id="site-search"
                type="search"
                placeholder="서비스 검색"
                autocomplete="off"
                aria-label="서비스 검색"
              />
            </div>

            <div
              class="option-filters"
              role="group"
              aria-label="카테고리 필터"
              id="category-filters"
            ></div>
          </div>
          <p id="search-empty-message" class="search-empty-message" hidden>
            조건에 맞는 서비스가 없습니다
          </p>
          <!-- 카테고리 영역은 src/data.js의 SITE_CATEGORIES에서 렌더한다. -->
          <div class="scroll-area" id="category-zones"></div>
        </div>

        <div class="column">
          <h2>내 바로가기 (활성화됨)</h2>
          <div class="scroll-area">
            <div
              id="active-list"
              class="drop-zone"
              style="min-height: 100%"
            ></div>
          </div>
        </div>
      </div>

      <button id="save-btn" class="save-btn">변경사항 저장하기</button>

      <p id="theme-status" class="theme-status" role="status" data-theme-status></p>

    </div>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="feedback.js"></script>
    <script src="options.js"></script>
  </body>
</html>
