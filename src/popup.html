<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LinKHU</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="popup-header">
        <div class="brand-row">
          <h1 class="popup-title">LinKHU</h1>
          <span id="current-version" class="current-version"></span>
          <span id="update-message"></span>
        </div>

        <button
          id="settings-btn"
          class="settings-button"
          type="button"
          title="설정"
          aria-label="LinKHU 설정 열기"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
      </header>

      <div class="search-bar">
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input
          id="service-search"
          type="search"
          placeholder="서비스 검색"
          autocomplete="off"
          aria-label="서비스 검색"
        />
      </div>

      <p id="empty-message" class="empty-message" hidden>검색 결과 없음</p>
      <div id="grid-container" class="grid-container"></div>

      <div id="feedback-panel" class="feedback-panel" hidden>
        <textarea
          id="feedback-message"
          rows="3"
          placeholder="불편한 점이나 추가하고 싶은 서비스를 적어주세요."
          aria-label="문의 내용"
        ></textarea>
        <input
          id="feedback-email"
          class="feedback-email"
          type="email"
          placeholder="답변 받을 이메일 (선택)"
          aria-label="답변 받을 이메일 (선택)"
          autocomplete="email"
          hidden
        />
        <div class="feedback-actions">
          <button id="feedback-send" class="feedback-send" type="button">
            보내기
          </button>
        </div>
        <p id="feedback-status" class="feedback-status" role="status"></p>
      </div>

      <footer class="popup-footer">
        <a
          id="homepage-link"
          class="footer-link"
          href="https://kangkyunghyun.github.io/LinKHU/"
          >홈페이지</a
        >
        <span class="footer-divider" aria-hidden="true">·</span>
        <button id="feedback-toggle" class="footer-link" type="button">
          문의하기
        </button>
      </footer>
    </div>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="version.js"></script>
    <script src="feedback.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
