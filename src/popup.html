<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinKHU</title>
    <!-- 첫 페인트 전에 테마 표식을 붙여야 하므로 스타일시트보다 먼저 로드한다. -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />

      <header

          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
          margin-bottom: 10px;

            style="
              margin: 0;
              font-size: 20px;
              font-weight: 700;
              color: var(--color-primary);
              line-height: 1;
            "

            LinKHU
          </h1>
          <span
            id="current-version"
            style="font-size: 12px; color: var(--color-text-muted); margin-left: 8px;"
          ></span>
          <span id="update-message"></span>
        </div>

          </button>
        </div>
      </header>

      <div class="search-bar">
        <input
          id="service-search"
          type="search"
          placeholder="서비스 검색"
          autocomplete="off"
          aria-label="서비스 검색"
        />
      </div>

      <p id="empty-message" class="empty-message" hidden>검색 결과 없음</p>
      <p id="theme-status" class="theme-status" role="status" data-theme-status></p>

      <div id="grid-container" class="grid-container"></div>

      <div id="feedback-panel" class="feedback-panel" hidden>
        <textarea
          id="feedback-message"
          rows="3"
          placeholder="불편한 점이나 추가하고 싶은 서비스를 적어주세요."
          aria-label="문의 내용"
        ></textarea>
        <input
          id="feedback-email"
          class="feedback-email"
          type="email"
          placeholder="답변 받을 이메일 (선택)"
          aria-label="답변 받을 이메일 (선택)"
          autocomplete="email"
          hidden
        />
        <div class="feedback-actions">
          <button id="feedback-send" class="feedback-send" type="button">
            보내기
          </button>
        </div>
        <p id="feedback-status" class="feedback-status" role="status"></p>
      </div>

      <footer class="popup-footer">
        <a
          id="homepage-link"
          class="footer-link"
          href="https://kangkyunghyun.github.io/LinKHU/"
          >홈페이지</a
        >
        <span class="footer-divider" aria-hidden="true">·</span>
        <button id="feedback-toggle" class="footer-link" type="button">
          문의하기
        </button>
      </footer>
    </div>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="version.js"></script>
    <script src="feedback.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
